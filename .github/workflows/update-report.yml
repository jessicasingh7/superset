name: Update Remediation Report

# Periodic report refresh. Triggers:
#   - cron every 15 minutes → regular snapshot
#   - workflow_dispatch     → manual refresh
#
# Event-driven refresh on PR/issue activity is intentionally NOT used here:
# it produced one report run per PR (8+ per batch) all titled after the
# triggering PR, which made the Actions list look like duplicated work.
# Per-PR status is already visible on the issue itself via the trigger
# workflow's bounded poll.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout solution repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REMEDIATION_REPO || 'jessicasingh7/vulnerability-remediation' }}
          ref: ${{ vars.REMEDIATION_REF || 'main' }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync state from GitHub + Devin
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
          DEVIN_API_TOKEN: ${{ secrets.DEVIN_API_TOKEN }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          VULN_PACK: ${{ vars.VULN_PACK || 'superset' }}
        run: python orchestrator.py --poll

      - name: Generate report
        env:
          GITHUB_REPO: ${{ github.repository }}
          VULN_PACK: ${{ vars.VULN_PACK || 'superset' }}
        run: python observability.py --summary

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          path: report.html
          archive: false
